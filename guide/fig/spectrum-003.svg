<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" fill="none" stroke-linecap="round" stroke-linejoin="round">
<title>기분 스펙트럼: 정상 기분, 우울증, 조증/경조증의 기분 변화</title>
<g font-family="'Pretendard Variable','Pretendard','Apple SD Gothic Neo',sans-serif" fill="#33353d" stroke="none">
<g font-size="12.5">
<text x="48" y="22" font-family="'MaruBuri','AppleMyungjo',serif" font-size="16" font-weight="700">정상 기분:</text>
<text x="48" y="48">보통사람들이 느끼는 정상범주 안에서의</text>
<text x="48" y="68">기분 변화</text>
<text x="48" y="94">아무리 기분 좋은 일이나 기분 나쁜 일이</text>
<text x="48" y="114">있더라도 수일 이상 일정 범위를 벗어나지는</text>
<text x="48" y="134">않는다</text>
<text x="336" y="22" font-family="'MaruBuri','AppleMyungjo',serif" font-size="16" font-weight="700">우울증 :</text>
<text x="336" y="48">(2주일 이상 거의 매일, 하루 종일) 재미와</text>
<text x="336" y="68">흥미를 잃고 지속되는 우울감으로</text>
<text x="336" y="88">사회적·직업적으로 지장을 초래</text>
<text x="626" y="22" font-family="'MaruBuri','AppleMyungjo',serif" font-size="16" font-weight="700">조증/경조증</text>
<text x="626" y="48">비정상적으로 들 떠 있는 상태.</text>
<text x="626" y="68">유쾌할 정도로 들 떠 있고 말이 많고 하고</text>
<text x="626" y="88">싶은 것도 많지만, 심각한 문제를 일으킬</text>
<text x="626" y="108">정도가 아니면 경조증.</text>
<text x="626" y="132">일주일 이상 기분이 들떠 있고, 사회적,</text>
<text x="626" y="152">직업적으로 지장을 초래할 정도면 조증.</text>
</g></g>
<g stroke="#33353d" stroke-width="1.2" stroke-dasharray="4 4"><path d="M326 10V560M616 10V560"/></g>
<rect x="45" y="210" width="855" height="60" fill="#d9c28e" fill-opacity=".55"/>
