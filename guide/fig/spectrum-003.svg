<g font-family="'Pretendard Variable','Pretendard','Apple SD Gothic Neo',sans-serif" font-size="15" fill="#5b7bb5" text-anchor="middle">
<text x="19" y="368">정</text><text x="19" y="386">상</text><text x="19" y="404">범</text><text x="19" y="422">주</text></g>
<g font-family="'Pretendard Variable','Pretendard','Apple SD Gothic Neo',sans-serif" font-size="15" fill="#33353d" text-anchor="middle">
<rect x="540" y="227" width="154" height="20" rx="4" fill="#fbf8f1" fill-opacity=".85"/><text x="617" y="243">조 증</text>
<rect x="534" y="287" width="154" height="22" rx="4" fill="#fbf8f1" fill-opacity=".85"/><text x="611" y="304">경조증</text>
<rect x="540" y="465" width="140" height="22" rx="4" fill="#fbf8f1" fill-opacity=".85"/><text x="610" y="482">경한 우울</text>
<rect x="540" y="522" width="140" height="22" rx="4" fill="#fbf8f1" fill-opacity=".85"/><text x="610" y="539">심한 우울</text>
<text x="845" y="318" font-size="14" fill="#9b2f35">경조증</text></g>
