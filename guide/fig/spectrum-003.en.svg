<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" fill="none" stroke-linecap="round" stroke-linejoin="round">
<title>Mood spectrum: mood changes in normal mood, depression, and mania/hypomania</title>
<g font-family="'Pretendard Variable','Pretendard','Apple SD Gothic Neo',sans-serif" fill="#33353d" stroke="none">
<g font-size="12.5">
<text x="48" y="22" font-family="'MaruBuri','AppleMyungjo',serif" font-size="16" font-weight="700">Normal mood:</text>
<text x="48" y="48">Mood changes within the normal range</text>
<text x="48" y="68">that ordinary people experience</text>
<text x="48" y="94">No matter how good or bad the events,</text>
<text x="48" y="114">mood does not leave a certain range</text>
<text x="48" y="134">for more than a few days</text>
<text x="336" y="22" font-family="'MaruBuri','AppleMyungjo',serif" font-size="16" font-weight="700">Depression:</text>
<text x="336" y="48">(Nearly every day for 2 weeks or more,</text>
<text x="336" y="68">all day) Loss of enjoyment and interest</text>
<text x="336" y="88.0">with lasting low mood that disrupts</text><text x="336" y="108.0">social and occupational functioning</text>
<text x="626" y="22" font-family="'MaruBuri','AppleMyungjo',serif" font-size="16" font-weight="700">Mania/Hypomania</text>
<text x="626" y="48">An abnormally elevated state.</text>
<text x="626" y="68">Cheerfully high, talkative, and eager to do</text>
<text x="626" y="88">many things, but not enough to cause</text>
<text x="626" y="108">serious problems: hypomania.</text>
<text x="626" y="132">Elevated mood lasting a week or more and</text>
<text x="626" y="152">disrupting social or work life: mania.</text>
</g></g>
<g stroke="#33353d" stroke-width="1.2" stroke-dasharray="4 4"><path d="M326 10V560M616 10V560"/></g>
<rect x="45" y="210" width="855" height="60" fill="#d9c28e" fill-opacity=".55"/>
<rect x="45" y="270" width="855" height="60" fill="#d9c28e" fill-opacity=".28"/>
