<rect x="45" y="500" width="855" height="60" fill="#aab4d6" fill-opacity=".6"/>
<g stroke="#33353d" stroke-width="1.4"><path d="M45 210H900M45 270H900M45 330H900M45 445H900M45 500H900M45 560H900"/></g>
<path d="M45 385H900" stroke="#33353d" stroke-width="1.8"/>
<rect x="1" y="347" width="36" height="90" rx="6" fill="#fbf8f1" stroke="#aab4d6" stroke-width="1.2"/>
<g font-family="'Pretendard Variable','Pretendard','Apple SD Gothic Neo',sans-serif" font-size="15" fill="#5b7bb5" text-anchor="middle">
<text transform="rotate(-90 24 392)" x="24" y="392" font-size="13">Normal range</text></g>
<g font-family="'Pretendard Variable','Pretendard','Apple SD Gothic Neo',sans-serif" font-size="15" fill="#33353d" text-anchor="middle">
<rect x="540" y="227" width="154" height="20" rx="4" fill="#fbf8f1" fill-opacity=".85"/><text x="617" y="243">Mania</text>
<rect x="534" y="287" width="154" height="22" rx="4" fill="#fbf8f1" fill-opacity=".85"/><text x="611" y="304">Hypomania</text>
<rect x="540" y="465" width="140" height="22" rx="4" fill="#fbf8f1" fill-opacity=".85"/><text x="610" y="482">Mild depression</text>
<rect x="540" y="522" width="140" height="22" rx="4" fill="#fbf8f1" fill-opacity=".85"/><text x="610" y="539">Severe depression</text>
<text x="832" y="309" font-size="13" fill="#9b2f35">Hypomania</text></g>
