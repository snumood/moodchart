<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" font-family="'Pretendard Variable','Pretendard','Apple SD Gothic Neo',sans-serif" font-size="14" fill="#33353d" role="img">
<title>Course without treatment: mood swings grow larger even without events</title>
<defs><marker id="a2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1.5 L9,5 L1,8.5" fill="none" stroke="#33353d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6">
<path d="M177,267 C186.2,267 190.8,272 200,272 C212.8,272 219.2,259 232,259 C240.8,259 245.2,276 254,276 C266,276 272,254 284,254 C299.2,254 306.8,285 322,285 C351.6,285 366.4,242 396,242 C402.4,242 405.6,267 412,267 C423.2,267 428.8,276 440,276 C474,276 491,212 525,212 C546.2,212 556.8,312 578,312 C590.8,312 597.2,187 610,187 C622.8,187 629.2,352 642,352 C652.4,352 657.6,160 668,160 C678,160 683,267 693,267 L177,267 Z" fill="#d9a441" stroke="#33353d" stroke-width="1.4" fill-opacity="0.85"/><line x1="105" y1="267" x2="746" y2="267" stroke="#33353d" stroke-width="1.6" /><line x1="412" y1="55" x2="412" y2="378" stroke="#8d8f98" stroke-width="1.2" stroke-dasharray="4 4"/><text x="205" y="52" font-size="15" text-anchor="middle" font-weight="600" fill="#33353d" stroke="none">Early on, mood is driven by events</text><text x="583" y="50" font-size="15" text-anchor="middle" font-weight="600" fill="#33353d" stroke="none">If left untreated:</text><text x="583" y="80" font-size="15" text-anchor="middle" font-weight="600" fill="#33353d" stroke="none">Even without events or stimuli,</text><text x="583" y="110" font-size="15" text-anchor="middle" font-weight="600" fill="#33353d" stroke="none">mood swings grow larger</text><ellipse cx="174" cy="178" rx="118" ry="38" fill="#aab4d6" stroke="#5b7bb5" stroke-width="1.6"/><text x="174" y="174" font-size="14" text-anchor="middle" font-weight="600" fill="#33353d" stroke="none">Promotion, college admission,</text><text x="174" y="196" font-size="14" text-anchor="middle" font-weight="600" fill="#33353d" stroke="none">financial gain, etc.</text><ellipse cx="293" cy="344" rx="108" ry="40" fill="#8d8f98" fill-opacity="0.55" stroke="#33353d" stroke-width="1.6"/><text x="293" y="330.0" font-size="13.5" text-anchor="middle" font-weight="600" fill="#33353d" stroke="none">Bereavement / breakup /</text><text x="293" y="346.0" font-size="13.5" text-anchor="middle" font-weight="600" fill="#33353d" stroke="none">forced retirement /</text><text x="293" y="362.0" font-size="13.5" text-anchor="middle" font-weight="600" fill="#33353d" stroke="none">business failure</text><line x1="232" y1="212" x2="280" y2="250" stroke="#33353d" stroke-width="1.3" marker-end="url(#a2)"/><line x1="302" y1="312" x2="314" y2="284" stroke="#33353d" stroke-width="1.3" marker-end="url(#a2)"/><text x="10" y="424" font-size="15" fill="#33353d" stroke="none">Figure. Course when left untreated</text>
